# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
name: Build and deploy Node.js app to Azure Web App - fiadocheck-api
on:
  push:
    branches:
      - develop
    paths:
      - 'backend/**'
      - '!backend/ml_service/**'
      - '.github/workflows/develop_fiadocheck-api.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Armar paquete limpio (sin ml_service, sin .env)
        run: |
          mkdir -p clean-api
          rsync -av --exclude='ml_service' --exclude='.env' --exclude='node_modules' backend/ clean-api/

      - name: Instalar dependencias de producción
        working-directory: clean-api
        run: npm ci --omit=dev

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: clean-api

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7A9024BDB2014AC7A7677BDF2697DEE9 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A73A64F0C63140C585D21B28B09FAE38 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_19832F09E3A5458B8B209890C723D61A }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'fiadocheck-api'
          slot-name: 'Production'
          package: .
