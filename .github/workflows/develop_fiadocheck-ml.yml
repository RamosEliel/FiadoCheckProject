# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions
name: Build and deploy Python app to Azure Web App - fiadocheck-ml
on:
  push:
    branches:
      - develop
    paths:
      - 'backend/ml_service/**'
      - '.github/workflows/develop_fiadocheck-ml.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Azure reconstruye el entorno con Oryx a partir de requirements.txt, así que
      # este venv no viaja en el artefacto: solo valida que las dependencias instalan.
      - name: Validar que requirements.txt instala
        working-directory: backend/ml_service
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            backend/ml_service
            !backend/ml_service/antenv/
            !backend/ml_service/*.log
            !backend/ml_service/_diag_tmp.py

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5FE516FD709D4C98A2489FEEAFDCA43B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B74AC4D8612A458CAF3276D9ABA942A0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3B537C3D72AC4DE2B6D6EE8B7CC46823 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'fiadocheck-ml'
          slot-name: 'Production'
          # Sin esto, Azure busca app.py/application.py con gunicorn y el sitio no arranca.
          # predict.py resuelve el puerto desde ML_PORT, luego PORT (inyectada por Azure).
          startup-command: 'python predict.py'
